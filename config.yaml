# ---------------------------------------------------------------------------
# Job alert settings. Edit freely.
# NOTE: if your GitHub repo is PUBLIC (needed for the free tracker website),
# everything in this file is public too. To keep the salary range private,
# see README, "Keeping your salary range private".
# ---------------------------------------------------------------------------

daily_count: 10            # max jobs per message (fewer if fewer qualify)
max_age_days: 0            # 0 = no limit on how old a posting is (fresher jobs are still ranked first)
max_experience_years: 6    # skip jobs whose minimum experience is above this (jobs asking 1-6 years are fine)
max_per_company: 2         # stops one company filling the whole list
alert_daily_count: 10      # jobs per day in the SEPARATE message built from alert emails (LinkedIn / Naukri / Indeed)
alert_queue_max_days: 30   # alert-email jobs wait in a queue and are released daily; unsent ones expire after this many days (30)
allow_unknown_date: true   # jobs with no posting date are kept (only matters if max_age_days is set)
near_match_fill: false     # no padding with weak matches
strict_min_score: 50       # match % needed to be shown
suspicious_listed_max: 3   # how many suspicious jobs to show (separately)

salary:
  min_lpa: 10              # a salary that is clearly listed below this is dropped. No salary listed = kept (own section)
  max_lpa: 20              # NOT a filter: only used to spot too-good-to-be-true pay. Higher salaries are always kept
  near_tolerance: 0        # no leniency below the minimum
  # Approximate conversion to INR for foreign salaries. Update now and then.
  rates_to_inr: {INR: 1, USD: 88.0, EUR: 102.0, GBP: 118.0, AUD: 57.0, CAD: 64.0, SGD: 66.0, AED: 24.0}

