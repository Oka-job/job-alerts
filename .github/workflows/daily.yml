name: Daily job alerts

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC = 11:30 AM IST (GitHub often starts 10-30 min late, so it lands around midday)
  workflow_dispatch:          # lets you press "Run workflow" to test it now

permissions:
  contents: write             # needed to save the history the tracker page reads

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Find and send today's jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOB_CONFIG: ${{ secrets.JOB_CONFIG }}
          TRACKER_URL: ${{ vars.TRACKER_URL }}
        run: python -m jobalerts.main

      - name: Save history for the tracker page
        run: |
          git config user.name "job-alerts-bot"
          git config user.email "job-alerts-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Daily job history" && git push)
